<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experience OS Admin</title><style>body{margin:0;background:#f3f5f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#17222a}.shell{max-width:1100px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:white;border:1px solid #d8ddd9;border-radius:24px;padding:30px;margin-top:20px;box-shadow:0 15px 40px rgba(23,34,42,.08)}button{border:0;border-radius:999px;background:#0f6e6d;color:white;padding:13px 20px;font-weight:800;cursor:pointer}.muted{color:#5f6b72}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border:1px solid #d8ddd9;border-radius:16px;padding:16px}.metric b{font-size:1.8rem;display:block}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e6e3;font-size:.9rem}.empty{padding:35px;text-align:center;background:#f8faf9;border-radius:16px}.danger{background:#8e4a4d}input[type=file]{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.shell{padding:15px}}</style></head><body><div class="shell"><div class="top"><div><h1>Experience OS Admin</h1><div class="muted">Offline response importer</div></div><div><label for="files"><span style="display:inline-block;border-radius:999px;background:#0f6e6d;color:white;padding:13px 20px;font-weight:800;cursor:pointer">Import response files</span></label><input id="files" type="file" multiple accept=".json,application/json"> <button id="clear" class="danger">Clear</button></div></div><div class="card"><div id="summary"></div><div id="table"></div><div id="feedbackTable"></div></div></div><script>(function(){'use strict';var responses=[];var files=document.getElementById('files');files.onchange=function(){var list=this.files,left=list.length;if(!left)return;for(var i=0;i<list.length;i++){(function(file){var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(x&&x.profile&&x.answers)responses.push(x);}catch(e){alert('Could not import '+file.name);}left--;if(left===0)render();};r.readAsText(file);})(list[i]);}};document.getElementById('clear').onclick=function(){responses=[];files.value='';render();};function esc(v){return String(v||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function render(){var s=document.getElementById('summary'),t=document.getElementById('table'),ft=document.getElementById('feedbackTable');if(!responses.length){s.innerHTML='<div class="empty"><h2>No responses imported yet</h2><p class="muted">Select one or more exported Experience OS JSON files.</p></div>';t.innerHTML='';ft.innerHTML='';return;}var depts={},persp={},sum=0;for(var i=0;i<responses.length;i++){var p=responses[i].profile||{},d=p.department||'Unspecified';depts[d]=(depts[d]||0)+1;var ps=p.perspectives||[];for(var j=0;j<ps.length;j++)persp[ps[j]]=(persp[ps[j]]||0)+1;if(responses[i].scores&&responses[i].scores.overall)sum+=Number(responses[i].scores.overall);}s.innerHTML='<div class="grid"><div class="metric"><span>Responses</span><b>'+responses.length+'</b></div><div class="metric"><span>Departments</span><b>'+Object.keys(depts).length+'</b></div><div class="metric"><span>Perspectives</span><b>'+Object.keys(persp).length+'</b></div><div class="metric"><span>Average maturity</span><b>'+(sum/responses.length).toFixed(1)+'</b></div></div>';var h='<table><thead><tr><th>First name</th><th>Department</th><th>Events/year</th><th>Functional perspectives</th><th>Overall</th><th>Greatest opportunity</th></tr></thead><tbody>';for(i=0;i<responses.length;i++){var x=responses[i],pr=x.profile||{},sc=x.scores||{};h+='<tr><td>'+esc(pr.firstName)+'</td><td>'+esc(pr.department)+'</td><td>'+esc(pr.eventVolume)+'</td><td>'+esc((pr.perspectives||[]).join(', '))+'</td><td>'+esc(sc.overall?Number(sc.overall).toFixed(1):'')+'</td><td>'+esc(sc.highest&&sc.highest.name?sc.highest.name:'')+'</td></tr>';}h+='</tbody></table>';t.innerHTML=h;var fh='<h2 style="margin-top:34px">Pilot feedback</h2><table><thead><tr><th>Name</th><th>Review accuracy</th><th>Review comments</th><th>Conclusion accuracy</th><th>Conclusion comments</th><th>Hardest questions</th><th>Why difficult</th></tr></thead><tbody>';for(i=0;i<responses.length;i++){var y=responses[i],pf=y.profile||{},fb=y.feedback||{};fh+='<tr><td>'+esc(pf.firstName)+'</td><td>'+esc(fb.reviewAccuracy)+'</td><td>'+esc(fb.reviewAccuracyComment)+'</td><td>'+esc(fb.conclusionAccuracy)+'</td><td>'+esc(fb.conclusionAccuracyComment)+'</td><td>'+esc((fb.hardestQuestions||[]).join(', '))+'</td><td>'+esc(fb.hardestReason)+'</td></tr>';}fh+='</tbody></table>';ft.innerHTML=fh;}render();})();</script></body></html>
