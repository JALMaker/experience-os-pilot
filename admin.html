<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Experience OS Admin · Anonymous Pilot</title>
<style>
:root{--ink:#17222a;--muted:#617078;--paper:#eef2ef;--card:#fff;--line:#d9dfdb;--teal:#0f7773;--teal-soft:#e6f4f1;--amber:#b97900;--amber-soft:#fff4d9;--rose:#b83a5a;--rose-soft:#fde9ee;--navy:#15324a;--shadow:0 18px 50px rgba(23,34,42,.09)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f7f7f4,#eaf1ee);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}
.shell{max-width:1440px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.brand h1{margin:0;font-size:2rem;letter-spacing:-.04em}.muted{color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}button,.button{border:0;border-radius:999px;background:var(--teal);color:white;padding:13px 20px;font-weight:800;cursor:pointer;font:inherit}.secondary{background:#e5ebe8;color:var(--ink)}.danger{background:#955054}.button{display:inline-block}input[type=file]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:26px;margin-top:20px;box-shadow:var(--shadow)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{border:1px solid var(--line);border-radius:18px;padding:17px;background:#fff}.metric span{font-size:.82rem;color:var(--muted);font-weight:700}.metric b{display:block;font-size:1.95rem;margin-top:4px;letter-spacing:-.04em}
.section-title{display:flex;justify-content:space-between;gap:16px;align-items:end;margin:32px 0 14px}.section-title h2{margin:0;font-size:1.5rem;letter-spacing:-.03em}.section-title p{margin:4px 0 0;color:var(--muted)}
.insight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.insight{border-radius:19px;padding:20px;border:1px solid}.insight h3{margin:4px 0 8px;font-size:1.25rem}.insight p{line-height:1.5;margin:6px 0}.insight .eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:900}.shared{background:var(--teal-soft);border-color:#b8ddd6}.shared .eyebrow{color:var(--teal)}.emerging{background:var(--amber-soft);border-color:#eed49b}.emerging .eyebrow{color:var(--amber)}.priority{background:var(--rose-soft);border-color:#edbdca}.priority .eyebrow{color:var(--rose)}
.question{margin-top:12px;padding:12px 14px;border-left:3px solid currentColor;background:rgba(255,255,255,.6);border-radius:0 12px 12px 0;font-weight:750}
.filters{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin-bottom:16px}.field label{display:block;font-size:.78rem;color:var(--muted);font-weight:800;margin:0 0 6px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:white;font:inherit}
.stage-row{display:grid;grid-template-columns:240px 1fr 110px 150px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #e8ece9}.stage-row:last-child{border-bottom:0}.stage-name{font-weight:800}.bar-track{height:13px;background:#edf0ee;border-radius:99px;overflow:hidden}.bar{height:100%;border-radius:99px;background:linear-gradient(90deg,#5a39c8,#1588d8,#15a78c,#e4b21c,#df3d75)}.spread{font-weight:800}.status{font-size:.76rem;font-weight:900;border-radius:999px;padding:7px 10px;text-align:center}.status.shared{color:var(--teal)}.status.emerging{color:var(--amber)}.status.priority{color:var(--rose)}
.matrix-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5e9e6;font-size:.88rem;vertical-align:top}th{position:sticky;top:0;background:#f7f9f8;z-index:1;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:#44535b}td.score{text-align:center;font-weight:850}.score-pill{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:2px solid var(--teal);background:white}.score-pill.low{border-color:var(--rose)}.score-pill.mid{border-color:var(--amber)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.theme{border:1px solid var(--line);border-radius:17px;padding:17px}.theme h3{margin:0 0 7px}.theme .count{font-size:.78rem;color:var(--teal);font-weight:900}.quote{margin-top:12px;color:#3e4c53;font-style:italic;line-height:1.45}
.mapping-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mapping-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin:8px 0}.mapping-row input,.mapping-row select{border:1px solid var(--line);border-radius:11px;padding:10px;font:inherit;width:100%}.small{padding:9px 12px;border-radius:11px}.empty{padding:44px;text-align:center;background:#f8faf9;border-radius:18px}.detail{margin-top:18px}.detail summary{cursor:pointer;font-weight:850;padding:12px 0}.detail-card{border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0;background:#fbfcfb}.detail-card h4{margin:0 0 8px}.tag{display:inline-block;margin:3px 5px 3px 0;padding:5px 8px;border-radius:999px;background:#edf3f1;font-size:.76rem;font-weight:750}
@media(max-width:1000px){.metrics,.insight-grid,.theme-grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.stage-row{grid-template-columns:170px 1fr 85px}.stage-row .status{grid-column:2/4;justify-self:start}.mapping-grid{grid-template-columns:1fr}}
@media(max-width:680px){.shell{padding:14px}.top{display:block}.actions{justify-content:flex-start;margin-top:16px}.metrics,.insight-grid,.theme-grid{grid-template-columns:1fr}.stage-row{grid-template-columns:1fr}.stage-row .status{grid-column:auto}.card{padding:18px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><h1>Experience OS Admin · Anonymous Pilot</h1><div class="muted">Organizational insight and conversation guide</div></div>
    <div class="actions">
      <label for="files" class="button">Import response files</label>
      <input id="files" type="file" multiple accept=".json,application/json">
      <button id="exportSummary" class="secondary">Export summary</button>
      <button id="clear" class="danger">Clear</button>
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
(function(){
'use strict';
var responses=[];
var departmentMap={
  'm&e':'Meetings & Events','m and e':'Meetings & Events','meetings and events':'Meetings & Events','meeting and events':'Meetings & Events','meeting & events':'Meetings & Events','events':'Meetings & Events',
  'procurement':'Procurement','finance':'Finance','marketing':'Marketing','technology':'Technology','legal':'Legal','agency':'Agency / External Partner','conference center':'Internal Conference Center'
};
var stages=[
  ['stakeholder','Stakeholder Strategy'],['intake','Intake & Governance'],['design','Experience Design'],['sourcing','Sourcing & Venues'],['contracting','Contracting'],['planning','Planning & Logistics'],['financial','Financial Management & Insights'],['value','Value & ROI'],['improve','Continuous Improvement']
];
var lenses=['Governance','Experience','Intelligence','Risk'];
var files=document.getElementById('files');
files.onchange=function(){var list=this.files,left=list.length;if(!left)return;for(var i=0;i<list.length;i++){(function(file){var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(x&&x.profile&&x.answers){x.__file=file.name;responses.push(x);}}catch(e){alert('Could not import '+file.name);}left--;if(left===0)render();};r.readAsText(file);})(list[i]);}};
document.getElementById('clear').onclick=function(){responses=[];files.value='';render();};
document.getElementById('exportSummary').onclick=function(){if(!responses.length)return alert('Import responses first.');var data=buildAnalysis(filteredResponses());download('ExperienceOS_Admin_Summary_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json');};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function slug(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,' ' ).trim();}
function canonicalDepartment(v){var s=slug(v);return departmentMap[s]||String(v||'Unspecified').trim()||'Unspecified';}
var perspectiveMap={'Business Sponsor':'Experiential','Event Strategy & Leadership':'Experiential','Marketing & Communications':'Experiential','Experiential':'Experiential','Event Planning & Delivery':'Operations','Operations':'Operations','Procurement & Contracting':'Procurement & Contracting','Finance & Payment':'Finance','Finance':'Finance','Technology & Operations':'Technology & Data','Technology & Data':'Technology & Data','External Partner':'External Partners','External Partners':'External Partners','Other':'Other'};
function normalizedPerspectives(resp){var p=(resp.profile&&resp.profile.perspectives)||[];return uniq(p.map(function(x){return perspectiveMap[x]||x;}));}
function responseId(resp,index){return (resp.profile&&resp.profile.responseId)||('Anonymous '+String(index+1).padStart(2,'0'));}
function stageScore(resp,id){if(resp.scores&&resp.scores.stageScores&&resp.scores.stageScores[id]!=null)return Number(resp.scores.stageScores[id]);var vals=[],a=resp.answers||{};Object.keys(a).forEach(function(k){if(k.indexOf(id+':')===0&&Number(a[k]))vals.push(Number(a[k]));});return vals.length?vals.reduce(function(x,y){return x+y;},0)/vals.length:0;}
function perspectiveLabel(resp){var p=normalizedPerspectives(resp);return p.length?p.join(' + '):'Unspecified';}
function uniq(a){var o={},r=[];a.forEach(function(x){if(!o[x]){o[x]=1;r.push(x);}});return r;}
function avg(a){var b=a.filter(function(x){return isFinite(x)&&x>0;});return b.length?b.reduce(function(x,y){return x+y;},0)/b.length:0;}
function spread(a){var b=a.filter(function(x){return isFinite(x)&&x>0;});return b.length>1?Math.max.apply(null,b)-Math.min.apply(null,b):0;}
function statusFor(sp){return sp<=.45?'shared':sp<=1.0?'emerging':'priority';}
function statusText(s){return s==='shared'?'Shared understanding':s==='emerging'?'Emerging differences':'Priority conversation';}
function filteredResponses(){var d=document.getElementById('filterDept'),p=document.getElementById('filterPerspective');var dv=d?d.value:'',pv=p?p.value:'';return responses.filter(function(r){return (!dv||canonicalDepartment(r.profile.department)===dv)&&(!pv||normalizedPerspectives(r).indexOf(pv)>=0);});}
function buildAnalysis(rs){
  var stageStats=stages.map(function(st){var vals=rs.map(function(r){return stageScore(r,st[0]);}).filter(Boolean);return {id:st[0],name:st[1],average:avg(vals),spread:spread(vals),status:statusFor(spread(vals)),values:vals};});
  var sorted=stageStats.slice().sort(function(a,b){return a.spread-b.spread;});
  var shared=sorted[0],priority=sorted[sorted.length-1],emerging=sorted[Math.floor(sorted.length/2)];
  var comments=[];rs.forEach(function(r){var f=r.feedback||{};['reviewAccuracyComment','conclusionAccuracyComment','hardestReason','missing','change','comments'].forEach(function(k){if(f[k])comments.push({text:String(f[k]),field:k});});});
  var themes=extractThemes(comments);
  return {generatedAt:new Date().toISOString(),responseCount:rs.length,stageStats:stageStats,shared:shared,emerging:emerging,priority:priority,themes:themes};
}
function extractThemes(comments){
  var defs=[
    ['Late decisions / compressed timelines',['late','short notice','compressed','scramble','pace','time']],
    ['Limited visibility',['visibility','do not have visibility','less visibility','not captured']],
    ['Customization vs. consistency',['bespoke','custom','varies','different','generalize','standard']],
    ['Feedback not implemented',['feedback','improvement','doesn\'t always implement','hard to change']],
    ['Ownership and handoffs',['ownership','stakeholder','handoff','decision','responsibility']],
    ['Planning and design involvement',['planning','intent','design','earlier','upstream']]
  ];
  var out=[];defs.forEach(function(d){var hits=comments.filter(function(c){var t=c.text.toLowerCase();return d[1].some(function(k){return t.indexOf(k)>=0;});});if(hits.length)out.push({theme:d[0],count:hits.length,quote:hits[0].text});});
  if(!out.length&&comments.length)out.push({theme:'Open-text feedback',count:comments.length,quote:comments[0].text});
  return out.sort(function(a,b){return b.count-a.count;}).slice(0,6);
}
function conversationQuestion(stat,themes){
  var map={stakeholder:'Where do teams need greater clarity on purpose, ownership, or decision rights?',intake:'How can we make the right support path and guardrails clearer at the start?',design:'How can we preserve creativity while creating a more consistent design approach?',sourcing:'Where are sourcing choices experienced differently, and what information would improve them?',contracting:'Which contracting risks or handoffs are not equally visible to all groups?',planning:'How can we improve early visibility and decision timing without adding unnecessary process?',financial:'How can financial information become more visible and useful throughout the lifecycle?',value:'What does success mean to each group, and where are those definitions misaligned?',improve:'How do we turn feedback into visible changes that teams can recognize?'};
  return map[stat.id]||'What is driving the difference in how teams experience this capability?';
}
function render(){
  var app=document.getElementById('app');
  if(!responses.length){app.innerHTML='<div class="card"><div class="empty"><h2>No responses imported yet</h2><p class="muted">Select one or more exported Experience OS JSON files. Nothing leaves this browser.</p></div></div>';return;}
  var departments=uniq(responses.map(function(r){return canonicalDepartment(r.profile.department);})).sort();
  var perspectives=uniq([].concat.apply([],responses.map(function(r){return r.profile.perspectives||[];}))).sort();
  var currentDept=document.getElementById('filterDept')?document.getElementById('filterDept').value:'';
  var currentPers=document.getElementById('filterPerspective')?document.getElementById('filterPerspective').value:'';
  var filter='<div class="card"><div class="section-title" style="margin-top:0"><div><h2>Organization view</h2><p>Normalize local team names, then explore patterns by department or perspective. Names are not displayed; open-text feedback is synthesized anonymously.</p></div></div><div class="filters"><div class="field"><label>Organization / pilot name</label><input id="orgName" value="Mosaic Collective" aria-label="Organization name"></div><div class="field"><label>Department</label><select id="filterDept"><option value="">All departments</option>'+departments.map(function(d){return '<option '+(d===currentDept?'selected':'')+'>'+esc(d)+'</option>';}).join('')+'</select></div><div class="field"><label>Perspective</label><select id="filterPerspective"><option value="">All perspectives</option>'+perspectives.map(function(p){return '<option '+(p===currentPers?'selected':'')+'>'+esc(p)+'</option>';}).join('')+'</select></div></div><details><summary><strong>Department name mapping</strong> <span class="muted">— standardize labels without changing the source files</span></summary><div class="mapping-grid">'+departments.map(function(d){return '<div class="mapping-row"><input value="'+esc(d)+'" disabled><select data-map-source="'+esc(slug(d))+'">'+['Meetings & Events','Enterprise Services / SMM','Experience / Events','Procurement','Finance','Marketing','Technology','Legal','Agency / External Partner','Internal Conference Center','Business Sponsor','Other'].map(function(x){return '<option '+(x===d?'selected':'')+'>'+x+'</option>';}).join('')+'</select><button class="small secondary" data-save-map="'+esc(slug(d))+'">Apply</button></div>';}).join('')+'</div></details></div>';
  app.innerHTML=filter+'<div id="dashboard"></div>';
  document.getElementById('filterDept').onchange=renderDashboard;document.getElementById('filterPerspective').onchange=renderDashboard;
  var mapButtons=document.querySelectorAll('[data-save-map]');for(var m=0;m<mapButtons.length;m++)mapButtons[m].onclick=function(){var key=this.getAttribute('data-save-map'),sel=document.querySelector('[data-map-source="'+key+'"]');departmentMap[key]=sel.value;render();};
  renderDashboard();
}
function renderDashboard(){
  var rs=filteredResponses(),dash=document.getElementById('dashboard');if(!rs.length){dash.innerHTML='<div class="card"><div class="empty"><h2>No responses match these filters</h2></div></div>';return;}
  var a=buildAnalysis(rs),depts=uniq(rs.map(function(r){return canonicalDepartment(r.profile.department);})),pers=uniq([].concat.apply([],rs.map(function(r){return normalizedPerspectives(r);})));
  var html='<div class="card"><div class="metrics"><div class="metric"><span>Responses</span><b>'+rs.length+'</b></div><div class="metric"><span>Standardized departments</span><b>'+depts.length+'</b></div><div class="metric"><span>Perspectives</span><b>'+pers.length+'</b></div><div class="metric"><span>Priority conversations</span><b>'+a.stageStats.filter(function(s){return s.status==='priority';}).length+'</b></div></div></div>';
  html+='<div class="card"><div class="section-title" style="margin-top:0"><div><h2>Organizational pulse</h2><p>Where perspectives align—and where the next conversation should begin.</p></div></div><div class="insight-grid">'+insightCard(a.shared,'shared','Shared understanding','Perspectives are closest here.')+insightCard(a.emerging,'emerging','Emerging differences','There are meaningful differences worth exploring.')+insightCard(a.priority,'priority','Priority conversation','This is where perspectives differ most.')+'</div></div>';
  html+='<div class="card"><div class="section-title" style="margin-top:0"><div><h2>Alignment map</h2><p>Average capability and spread across the selected responses. A larger spread signals a more important conversation.</p></div></div>'+a.stageStats.map(function(s){return '<div class="stage-row"><div class="stage-name">'+esc(s.name)+'</div><div class="bar-track"><div class="bar" style="width:'+Math.max(4,s.average/5*100).toFixed(0)+'%"></div></div><div class="spread">'+s.average.toFixed(1)+' <span class="muted">/ 5</span></div><div class="status '+s.status+'">'+statusText(s.status)+'</div></div>';}).join('')+'</div>';
  html+='<div class="card"><div class="section-title" style="margin-top:0"><div><h2>Perspective comparison</h2><p>Compare Experiential, Operations, and other functional perspectives to see where understanding is shared—and where it differs.</p></div></div>'+matrixHtml(rs)+'</div>';
  html+='<div class="card"><div class="section-title" style="margin-top:0"><div><h2>Voice of the organization</h2><p>Anonymous themes from open-text feedback. The focus is on patterns, not people.</p></div></div><div class="theme-grid">'+(a.themes.length?a.themes.map(function(t){return '<div class="theme"><div class="count">Mentioned '+t.count+' time'+(t.count===1?'':'s')+'</div><h3>'+esc(t.theme)+'</h3><div class="muted">Synthesized from anonymous open-text feedback</div><div class="quote">“'+esc(t.quote)+'”</div></div>';}).join(''):'<div class="empty">No open-text themes available.</div>')+'</div></div>';
  html+='<div class="card"><div class="section-title" style="margin-top:0"><div><h2>Conversation starter</h2><p>The tool identifies where to begin; leaders and teams shape what happens next.</p></div></div><div class="insight priority"><div class="eyebrow">Recommended leadership discussion</div><h3>'+esc(a.priority.name)+'</h3><div class="question">'+esc(conversationQuestion(a.priority,a.themes))+'</div><p class="muted">Start by asking each perspective what evidence shaped its answer, what is within its control, and what one change would improve the shared experience.</p></div><details class="detail"><summary>View anonymous response detail and pilot feedback</summary>'+detailHtml(rs)+'</details></div>';
  dash.innerHTML=html;
}
function insightCard(stat,cls,title,desc){return '<div class="insight '+cls+'"><div class="eyebrow">'+title+'</div><h3>'+esc(stat.name)+'</h3><p>'+desc+'</p><p><strong>Average:</strong> '+stat.average.toFixed(1)+' &nbsp; <strong>Spread:</strong> '+stat.spread.toFixed(1)+'</p><div class="question">'+esc(conversationQuestion(stat,[]))+'</div></div>';}
function matrixHtml(rs){var groups=uniq([].concat.apply([],rs.map(function(r){return normalizedPerspectives(r);})));var h='<div class="matrix-wrap"><table><thead><tr><th>Capability</th>'+groups.map(function(g){return '<th>'+esc(g)+'</th>';}).join('')+'<th>Alignment insight</th></tr></thead><tbody>';stages.forEach(function(st){var all=[];h+='<tr><td><strong>'+esc(st[1])+'</strong></td>';groups.forEach(function(g){var vals=rs.filter(function(r){return normalizedPerspectives(r).indexOf(g)>=0;}).map(function(r){return stageScore(r,st[0]);}).filter(Boolean),v=avg(vals);if(v)all.push(v);h+='<td class="score">'+(v?'<span class="score-pill '+(v<3?'low':v<4?'mid':'')+'">'+v.toFixed(1)+'</span>':'—')+'</td>';});var sp=spread(all),status=statusFor(sp);h+='<td><span class="status '+status+'">'+statusText(status)+'</span><div class="muted" style="margin-top:6px">Spread '+sp.toFixed(1)+'</div></td></tr>';});h+='</tbody></table></div>';return h;}
function detailHtml(rs){return rs.map(function(r,i){var p=r.profile||{},f=r.feedback||{},rid=responseId(r,i);return '<div class="detail-card"><h4>'+esc(rid)+' · '+esc(canonicalDepartment(p.department))+'</h4><div><span class="tag">'+esc(p.eventVolume||'Events/year not stated')+'</span>'+normalizedPerspectives(r).map(function(x){return '<span class="tag">'+esc(x)+'</span>';}).join('')+'</div><p><strong>Greatest opportunity:</strong> '+esc(r.scores&&r.scores.highest?r.scores.highest.name:'Not available')+'</p>'+(f.reviewAccuracyComment?'<p><strong>Review feedback:</strong> '+esc(f.reviewAccuracyComment)+'</p>':'')+(f.conclusionAccuracyComment?'<p><strong>Conclusion feedback:</strong> '+esc(f.conclusionAccuracyComment)+'</p>':'')+(f.hardestReason?'<p><strong>Why questions were difficult:</strong> '+esc(f.hardestReason)+'</p>':'')+'</div>';}).join('');}
function download(name,text,type){var b=new Blob([text],{type:type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);}
render();
})();
</script>
</body>
</html>
